version: 1
applications:
  - appRoot: apps/frontend
    frontend:
      phases:
        preBuild:
          commands:
            # The npm workspaces lockfile lives at the repository root.
            - npm --prefix ../.. ci
        build:
          commands:
            - npm --prefix ../.. run build --workspace @land-registration/frontend
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
