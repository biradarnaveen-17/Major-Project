version: 1
applications:
  - appRoot: apps/frontend
    frontend:
      phases:
        preBuild:
          commands:
            # The npm workspaces lockfile lives at the repository root.
            - cd ../.. && npm ci
        build:
          commands:
            - cd ../.. && npm run build --workspace apps/frontend
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
