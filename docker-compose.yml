services:
  mongo:
    image: mongo:7
    container_name: land-registration-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-land_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-land_registration_research}
    volumes:
      - mongo_data:/data/db

  ganache:
    image: trufflesuite/ganache:latest
    container_name: land-registration-ganache
    restart: unless-stopped
    command:
      - "--host=0.0.0.0"
      - "--chain.chainId=${CHAIN_ID:-1337}"
      - "--wallet.totalAccounts=10"
      - "--wallet.defaultBalance=1000"
    ports:
      - "${GANACHE_PORT:-8545}:8545"

  backend:
    build:
      context: ./apps/backend
    container_name: land-registration-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - mongo
      - ganache

  frontend:
    build:
      context: ./apps/frontend
    container_name: land-registration-frontend
    restart: unless-stopped
    env_file:
      - ./apps/frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
